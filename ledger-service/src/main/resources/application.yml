spring:
  application:
    name: ledger-service
  jackson:
    time-zone: ${TZ:UTC}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ledger-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:payment_platform}
    username: ${POSTGRES_USER:payment}
    password: ${POSTGRES_PASSWORD:payment}
  flyway:
    default-schema: ledger
    schemas: ledger
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,prometheus
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} level=%-5level service=${spring.application.name} trace=%X{traceId:-} request=%X{requestId:-} logger=%logger{36} - %msg%n"
ledger:
  events:
    lifecycle-topic: ${PAYMENT_LIFECYCLE_TOPIC:payment.lifecycle.v1}
    dead-letter-topic: ${PAYMENT_DEAD_LETTER_TOPIC:payment.dlq.v1}
