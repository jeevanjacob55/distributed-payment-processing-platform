spring:
  application:
    name: fraud-service
  jackson:
    time-zone: ${TZ:UTC}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:fraud-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:payment_platform}
    username: ${POSTGRES_USER:payment}
    password: ${POSTGRES_PASSWORD:payment}
  flyway:
    default-schema: fraud
    schemas: fraud
    create-schemas: true
  profiles:
    default: dev
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints.web.exposure.include: health,info,prometheus
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} level=%-5level service=${spring.application.name} trace=%X{traceId:-} request=%X{requestId:-} logger=%logger{36} - %msg%n"
fraud:
  events:
    lifecycle-topic: ${PAYMENT_LIFECYCLE_TOPIC:payment.lifecycle.v1}
    decision-topic: ${PAYMENT_FRAUD_DECISION_TOPIC:payment.fraud-decision.v1}
    dead-letter-topic: ${PAYMENT_DEAD_LETTER_TOPIC:payment.dlq.v1}
  outbox:
    batch-size: ${FRAUD_OUTBOX_BATCH_SIZE:50}
    poll-interval: ${FRAUD_OUTBOX_POLL_INTERVAL:PT1S}
