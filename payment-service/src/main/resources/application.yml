spring:
  application:
    name: payment-service
  jackson:
    time-zone: ${TZ:UTC}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:payment_platform}
    username: ${POSTGRES_USER:payment}
    password: ${POSTGRES_PASSWORD:payment}
  flyway:
    default-schema: payment
    schemas: payment
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
payment:
  max-amount: ${PAYMENT_MAX_AMOUNT:1000000.0000}
  events:
    completed-topic: ${PAYMENT_COMPLETED_TOPIC:payment.completed}
  idempotency-lock:
    ttl: ${PAYMENT_IDEMPOTENCY_LOCK_TTL:PT30S}
management:
  endpoints.web.exposure.include: health,info,prometheus
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} level=%-5level service=${spring.application.name} trace=%X{traceId:-} request=%X{requestId:-} logger=%logger{36} - %msg%n"
